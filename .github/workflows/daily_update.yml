name: Daily German Content Generator

on:
  schedule:
    - cron: '0 8 * * *' # 每天 UTC 时间 08:00 运行（对应德国冬令时 09:00，夏令时 10:00）
  workflow_dispatch: # 允许在 GitHub 网页上手动点击运行以进行测试

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Commit and push generated HTML
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add index.html
          git commit -m "Auto-generate Daily Content" || exit 0
          git push
